# Real-ABM sensitivity-sweep env: TRAIN on live ABMs diversely parameterised
# across the paper's 8 sensitivity scenarios, EVAL on real D_val
# (greedy-normalised). Hyperparameters = trial 2 of the synthetic hypertune
# study rld2_synth_masked_v4 (value 0.8947, the current best): xlarge
# net [512,512,256], relu, ortho_init False, from-scratch.
RLD2_20-v2.1-nonlinear-masked-sensitivity:
  n_envs: 48
  n_timesteps: !!float 1e7
  policy: 'MlpPolicy'
  env_wrapper: gymnasium.wrappers.FlattenObservation
  gamma: 0.995
  batch_size: 16
